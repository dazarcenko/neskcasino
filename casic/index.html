<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeskShop Slots</title>
    <!-- Подключение скрипта Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- ЦВЕТА И ШРИФТЫ --- */
        :root {
            --nesk-yellow: #eab308;
            --nesk-yellow-dark: #854d0e;
            --nesk-black: #000000;
            --nesk-gray-dark: #111827;
            --nesk-gray-light: #1f2937;
            --text-main: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--nesk-black);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- ОВЕРЛЕЙ ПОДПИСКИ --- */
        .sub-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex; /* Изменится на none после проверки */
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .sub-modal {
            background-color: var(--nesk-gray-dark);
            border: 2px solid var(--nesk-yellow);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.3);
        }

        .sub-modal h3 {
            color: var(--nesk-yellow);
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        .sub-modal p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-channel {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-check-sub {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
        }

        /* --- ШАПКА --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--nesk-yellow);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
            background-color: var(--nesk-black);
        }

        .logo { color: var(--nesk-yellow); font-weight: 900; font-size: 1.3rem; }
        .logo span { color: var(--text-main); }

        .balance-badge {
            background-color: var(--nesk-gray-dark);
            border: 1px solid var(--nesk-yellow);
            color: var(--nesk-yellow);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1rem;
        }

        /* --- ИГРОВАЯ ЗОНА --- */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .status-message {
            color: var(--nesk-yellow);
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
            min-height: 2rem;
        }

        /* --- СЛОТЫ --- */
        .slots-container {
            background-color: var(--nesk-gray-dark);
            border: 4px solid var(--nesk-yellow);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
            position: relative;
            margin-bottom: 30px;
        }

        .rivet {
            position: absolute; width: 10px; height: 10px;
            background-color: #ca8a04; border-radius: 50%;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.3), inset -1px -1px 3px rgba(0,0,0,0.5);
        }
        .rivet.tl { top: 10px; left: 10px; }
        .rivet.tr { top: 10px; right: 10px; }
        .rivet.bl { bottom: 10px; left: 10px; }
        .rivet.br { bottom: 10px; right: 10px; }

        .bot-label {
            text-align: center; color: #ca8a04; font-size: 0.75rem;
            font-weight: bold; letter-spacing: 2px; margin-bottom: 15px;
        }

        .reels-wrapper {
            display: flex; justify-content: space-between; gap: 10px;
            background-color: var(--nesk-black); padding: 10px;
            border-radius: 10px; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        .reel {
            flex: 1; aspect-ratio: 1 / 1;
            background-color: var(--nesk-gray-light); border: 2px solid #374151;
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 3rem; overflow: hidden;
        }

        /* Анимация вращения барабанов */
        .spinning {
            animation: shake 0.15s infinite;
            filter: blur(1.5px);
        }

        @keyframes shake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-4px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(4px); }
            100% { transform: translateY(0); }
        }

        /* --- КНОПКИ И РЕФЕРАЛКА --- */
        .btn-start {
            width: 200px; padding: 15px;
            background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
            border: none; border-bottom: 6px solid #854d0e; border-radius: 15px;
            color: var(--nesk-black); font-size: 2rem; font-weight: 900;
            cursor: pointer; box-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
            transition: transform 0.1s, border-bottom-width 0.1s; margin-bottom: 30px;
        }
        .btn-start:active:not(:disabled) { transform: translateY(6px); border-bottom-width: 0px; }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; border-bottom-width: 6px; }

        .ref-container {
            width: 100%; max-width: 400px; background-color: var(--nesk-gray-dark);
            border: 1px solid #374151; border-radius: 10px; padding: 15px; text-align: center;
        }
        .ref-title { color: #60a5fa; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        .ref-input-group { display: flex; gap: 10px; }
        .ref-input { flex: 1; background-color: var(--nesk-black); border: 1px solid #4b5563; border-radius: 6px; color: #9ca3af; padding: 8px 10px; outline: none; }
        .btn-copy { background-color: #3b82f6; color: white; border: none; border-radius: 6px; padding: 0 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- МОДАЛЬНОЕ ОКНО ПОДПИСКИ -->
    <div id="subOverlay" class="sub-overlay">
        <div class="sub-modal">
            <h3>ДОСТУП ЗАКРЫТ</h3>
            <p>Подпишитесь на наш Telegram-канал, чтобы получить 5 стартовых спинов и начать играть!</p>
            <button class="btn-channel" id="btnGoChannel">ПЕРЕЙТИ В КАНАЛ</button>
            <button class="btn-check-sub" id="btnCheckSub">ПРОВЕРИТЬ ПОДПИСКУ</button>
            <p id="subError" style="color: #ef4444; margin-top: 10px; font-size: 0.8rem; display: none;">Вы еще не подписаны!</p>
        </div>
    </div>

    <!-- ШАПКА -->
    <header class="header">
        <div class="logo">NeskShop <span>Slots</span></div>
        <div class="balance-badge" id="spinsDisplay">СПИНЫ: 0</div>
    </header>

    <!-- ИГРОВАЯ ЗОНА -->
    <main class="game-area">
        <div class="status-message" id="statusMessage">НАЖМИ «START»</div>

        <div class="slots-container">
            <div class="rivet tl"></div><div class="rivet tr"></div>
            <div class="rivet bl"></div><div class="rivet br"></div>
            <div class="bot-label">— NESKSHOP BOT —</div>
            
            <div class="reels-wrapper">
                <div class="reel" id="reel1">🛒</div>
                <div class="reel" id="reel2">🛒</div>
                <div class="reel" id="reel3">🛒</div>
            </div>
        </div>

        <button class="btn-start" id="btnStart">START</button>

        <div class="ref-container">
            <div class="ref-title">ПОЛУЧИ ЗА КАЖДОГО ПРИГЛАШЕННОГО +3 СПИНА</div>
            <div class="ref-input-group">
                <input type="text" class="ref-input" id="refLink" readonly>
                <button class="btn-copy" id="btnCopy">КОПИЯ</button>
            </div>
        </div>
    </main>

    <!-- СКРИПТЫ -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');

        // Элементы
        const subOverlay = document.getElementById('subOverlay');
        const btnGoChannel = document.getElementById('btnGoChannel');
        const btnCheckSub = document.getElementById('btnCheckSub');
        const subError = document.getElementById('subError');
        
        const spinsDisplay = document.getElementById('spinsDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const reel1 = document.getElementById('reel1');
        const reel2 = document.getElementById('reel2');
        const reel3 = document.getElementById('reel3');
        const btnStart = document.getElementById('btnStart');
        const refLinkInput = document.getElementById('refLink');
        const btnCopy = document.getElementById('btnCopy');

        let spins = 0;
        let isSpinning = false;
        const SYMBOLS = ['🛒', '🛍️', '📦', '⭐', 'N'];
        const CHANNEL_LINK = 'https://t.me/твоя_ссылка_на_канал'; // ВСТАВЬ ССЫЛКУ СЮДА

        // --- 1. РЕФЕРАЛЬНАЯ СИСТЕМА ---
        const userId = tg.initDataUnsafe?.user?.id || '123456789';
        const firstName = tg.initDataUnsafe?.user?.first_name || 'Игрок';
        const botUsername = 'NeskShopBot';
        refLinkInput.value = `https://t.me/${botUsername}?start=${userId}`;

        btnCopy.addEventListener('click', () => {
            navigator.clipboard.writeText(refLinkInput.value).then(() => {
                const original = btnCopy.innerText;
                btnCopy.innerText = 'СКОПИРОВАНО!';
                setTimeout(() => btnCopy.innerText = original, 2000);
            });
        });

        function updateSpinsUI() { spinsDisplay.innerText = `СПИНЫ: ${spins}`; }

       // --- 2. ПРОВЕРКА ПОДПИСКИ ---
        
        // ВАЖНО: Ссылка должна начинаться строго с https://t.me/
        const CHANNEL_LINK = 'https://t.me/+INiZcAJcvoM0Zjgy'; 

        // Починка кнопки "Перейти в канал"
        btnGoChannel.addEventListener('click', () => {
            // Официальный метод Telegram для открытия ссылок
            tg.openTelegramLink(CHANNEL_LINK);
        });

        // Реальная проверка подписки через твой бэкенд
        btnCheckSub.addEventListener('click', async () => {
            btnCheckSub.innerText = 'ПРОВЕРЯЕМ...';
            btnCheckSub.disabled = true;
            subError.style.display = 'none'; // Прячем прошлую ошибку

            try {
                // Отправляем запрос на твой сервер (Railway)
                const response = await fetch('/api/check-sub', {
                    method: 'GET',
                    headers: { 'Authorization': tma ${tg.initData} }
                });
                
                // Получаем ответ от сервера: true (подписан) или false (не подписан)
                const isSubbed = await response.json();
                
                if (isSubbed === true) {
                    // Подписка есть -> пускаем в игру
                    subOverlay.style.display = 'none';
                    spins = 5;
                    updateSpinsUI();
                } else {
                    // Подписки НЕТ -> показываем твой кастомный текст
                    subError.innerHTML = Нет подписки на наш канал <a href="${CHANNEL_LINK}" style="color: #60a5fa; text-decoration: underline;">(ссылка на тгк)</a>;
                    subError.style.display = 'block';
                    btnCheckSub.innerText = 'ПРОВЕРИТЬ ПОДПИСКУ';
                    btnCheckSub.disabled = false;
                }
            } catch (error) {
                // Если сервер выключен или не отвечает
                console.error("Ошибка запроса:", error);
                subError.innerText = 'Ошибка сервера. Попробуй позже.';
                subError.style.display = 'block';
                btnCheckSub.innerText = 'ПРОВЕРИТЬ ПОДПИСКУ';
                btnCheckSub.disabled = false;
            }
        });
            // ЗДЕСЬ ДОЛЖЕН БЫТЬ ЗАПРОС НА БЭКЕНД:
            // const res = await fetch('/api/check-sub', { headers: { 'Authorization': `tma ${tg.initData}` } });
            // const isSubbed = await res.json();
            

        // --- 3. ФУНКЦИЯ ОТПРАВКИ АДМИНУ ---
        async function notifyAdminOfWin(winAmount) {
            // ЗДЕСЬ ДОЛЖЕН БЫТЬ ЗАПРОС НА БЭКЕНД ДЛЯ ОТПРАВКИ АДМИНУ:
            /*
            await fetch('/api/notify-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `tma ${tg.initData}` },
                body: JSON.stringify({ winAmount: winAmount, userId: userId, name: firstName })
            });
            */
            console.log(`[MOCK] Отправлено админу (1067205524): Игрок ${firstName} выиграл ${winAmount} спинов!`);
        }

        // --- 4. ЛОГИКА ВРАЩЕНИЯ СЛОТОВ (ПООЧЕРЕДНАЯ ОСТАНОВКА) ---
        // Вспомогательная функция для паузы (delay)
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // Функция запуска анимации одного барабана
        const startReelAnimation = (reelEl) => {
            reelEl.classList.add('spinning');
            return setInterval(() => {
                reelEl.innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
            }, 80); // скорость смены картинок
        };

        async function spin() {
            if (isSpinning) return;
            if (spins < 1) { statusMessage.innerText = 'НЕТ СПИНОВ!'; return; }

            isSpinning = true;
            btnStart.disabled = true;
            statusMessage.innerText = 'ВРАЩЕНИЕ...';
            
            // Запускаем независимую анимацию для КАЖДОГО барабана
            const int1 = startReelAnimation(reel1);
            const int2 = startReelAnimation(reel2);
            const int3 = startReelAnimation(reel3);

            try {
                // Генерируем результат (В БУДУЩЕМ ЗАПРОС НА СЕРВЕР)
                const getRandom = () => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                const getDiff = (exc) => { let s; do { s = getRandom(); } while(s === exc); return s; };
                
                const roll = Math.random();
                let result = [];
                let winAmount = 0;

                if (roll < 0.02) {
                    const sym = getRandom(); result = [sym, sym, sym]; winAmount = 10;
                } else if (roll < 0.32) {
                    const s1 = getRandom(); result = [s1, s1, getDiff(s1)]; winAmount = 0;
                } else {
                    const s1 = getRandom(); const s2 = getDiff(s1);
                    let s3; do { s3 = getRandom(); } while(s3 === s1 || s3 === s2);
                    result = [s1, s2, s3]; winAmount = 0;
                }
                // Конец генерации

                spins -= 1; // Списываем спин

                // --- ПООЧЕРЕДНАЯ ОСТАНОВКА ---
                
                // Ждем 1 секунду, останавливаем 1-й барабан
                await delay(1000);
                clearInterval(int1);
                reel1.classList.remove('spinning');
                reel1.innerText = result[0];

                // Ждем еще 0.5 секунды, останавливаем 2-й
                await delay(500);
                clearInterval(int2);
                reel2.classList.remove('spinning');
                reel2.innerText = result[1];

                // Ждем еще 0.6 секунды, останавливаем 3-й
                await delay(600);
                clearInterval(int3);
                reel3.classList.remove('spinning');
                reel3.innerText = result[2];

                // --- ИТОГ ---
                spins += winAmount;
                updateSpinsUI();

                if (winAmount > 0) {
                    statusMessage.innerText = `ВЫИГРЫШ: +${winAmount} СПИНОВ!`;
                    // Оповещаем админа о выигрыше
                    notifyAdminOfWin(winAmount);
                } else {
                    statusMessage.innerText = 'ПРОИГРЫШ';
                }

            } catch (e) {
                clearInterval(int1); clearInterval(int2); clearInterval(int3);
                reel1.classList.remove('spinning'); reel2.classList.remove('spinning'); reel3.classList.remove('spinning');
                statusMessage.innerText = 'ОШИБКА';
            }

            isSpinning = false;
            btnStart.disabled = false;
        }

        btnStart.addEventListener('click', spin);
    </script>
</body>
</html>
